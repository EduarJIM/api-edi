databases:
  - name: api-edi-db
    databaseName: edi_db
    user: edi_user
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

services:
  - type: web
    name: api-edi
    runtime: docker
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: api-edi-db
          property: connectionString
    healthCheckPath: /api/health
    autoDeploy: true